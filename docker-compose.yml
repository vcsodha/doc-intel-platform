services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=doc_intel
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d doc_intel"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  go-gateway:
    build:
      context: ./go-gateway
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
      - SHARED_VOL=/shared_data
      - DATABASE_URL=postgres://admin:password@postgres:5432/doc_intel?sslmode=disable
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./shared_data:/shared_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  python-worker:
    build:
      context: ./python-worker
    environment:
      - REDIS_HOST=redis
      - DB_HOST=postgres
      - DB_NAME=doc_intel
      - DB_USER=admin
      - DB_PASSWORD=password
      - OLLAMA_URL=http://ollama:11434
      - MAX_ATTEMPTS=3
      
      - CONFIDENCE_THRESHOLD=0.75
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./shared_data:/shared_data

  spring-analytics:
    build:
      context: ./spring-analytics
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/doc_intel
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=password
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ollama_data: